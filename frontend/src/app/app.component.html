<ng-container *ngIf="!bare; else bareTpl">
<div class="topbar">
  <div class="brand">UWorld <span>AI Trust &amp; Revenue Protection</span></div>
  <nav>
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">Dashboard</a>
    <a routerLink="/cases" routerLinkActive="active">Cases</a>
    <a routerLink="/rules" routerLinkActive="active">Rules Portal</a>
    <a href="/store" (click)="openStore($event)" title="Opens the simulated customer storefront in a new window">Customer Storefront ↗</a>
  </nav>
  <div class="sim">
    <div class="dropdown">
      <button class="btn-sim" [class.open]="menuOpen" [class.here]="onLab" (click)="menuOpen = !menuOpen" aria-haspopup="menu" [attr.aria-expanded]="menuOpen">
        <span class="si">⚗</span>
        <span class="lbl">Simulation Lab</span>
        <span class="caret">▾</span>
      </button>
      <div class="menu wide" *ngIf="menuOpen" role="menu">
        <div class="menuhdr">Attacks · should raise a case</div>
        <button *ngFor="let s of attacks" (click)="openScenario(s)" class="menuitem" role="menuitem">
          <span class="mi-ic">{{ s.icon }}</span>
          <span class="mi-txt"><span class="ml">{{ s.title }}</span><span class="mt">{{ s.summary }}</span></span>
          <span class="mi-go">›</span>
        </button>
        <div class="menuhdr">Legitimate · must stay quiet</div>
        <button *ngFor="let s of legit" (click)="openScenario(s)" class="menuitem" role="menuitem">
          <span class="mi-ic">{{ s.icon }}</span>
          <span class="mi-txt"><span class="ml">{{ s.title }}</span><span class="mt">{{ s.summary }}</span></span>
          <span class="mi-go">›</span>
        </button>
        <a class="menufoot" routerLink="/lab" (click)="menuOpen = false" role="menuitem">Open Simulation Lab →</a>
      </div>
    </div>
  </div>
</div>

<main>
  <router-outlet></router-outlet>
</main>
</ng-container>

<!-- the customer storefront renders full-page, without the analyst console chrome -->
<ng-template #bareTpl><router-outlet></router-outlet></ng-template>
